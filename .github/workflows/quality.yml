name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: pip install ruff==0.16.10 && ruff check .
  test:
    # the tests import the pipeline scripts from "..": check out video-pipeline, this repo inside it as panel/
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kamiljan11/video-pipeline
          fetch-depth: 0  # test_sound_v2 compares make_beds with an older commit
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: panel
          persist-credentials: false
      - name: Author's path (the pipeline scripts expect /home/kamil-jan/video-pipeline)
        run: sudo mkdir -p /home/kamil-jan && sudo ln -s "$GITHUB_WORKSPACE" /home/kamil-jan/video-pipeline
      - name: System tools (ffmpeg 8 as on the author's machine, apt has 6.1; poppler for web/PDF cards; Chrome for cards)
        env:
          FFMPEG_TAR: ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 3c2d43d951c1d7936240ec77dbc274d6214fc64973e9993f63e16f03ac908ff1
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
          curl -fsSL -o "/tmp/$FFMPEG_TAR" "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-24-13-02/$FFMPEG_TAR"
          echo "$FFMPEG_SHA256  /tmp/$FFMPEG_TAR" | sha256sum -c -
          tar -xJf "/tmp/$FFMPEG_TAR" -C /tmp && sudo cp /tmp/${FFMPEG_TAR%.tar.xz}/bin/ff* /usr/local/bin/
          ffmpeg -version | head -1
          test -x /usr/bin/google-chrome
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install (pipeline npm + .venv, panel .venv)
        run: |
          npm ci
          python -m venv .venv && .venv/bin/pip install -r requirements.txt
          python -m venv panel/.venv && panel/.venv/bin/pip install -r panel/requirements.txt
          python -m venv matte/.venv && matte/.venv/bin/pip install -r matte/requirements.txt
      - name: Models (face detector, matting), checksummed
        run: |
          mkdir -p models && curl -fsSL -o models/face_detection_yunet_2023mar.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          mkdir -p matte/models && curl -fsSL -o matte/models/rvm_resnet50_fp32.onnx https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_resnet50_fp32.onnx
          printf '%s  %s\n' 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4 models/face_detection_yunet_2023mar.onnx 25db300fcb6ee27f941a1b52c97856e8d1f13c7f35817f81a612f89af0e8a85c matte/models/rvm_resnet50_fp32.onnx | sha256sum -c -
      - name: Tests (no sample project, no slow end-to-end run)
        working-directory: panel
        env:
          MONTAZ_SLOW: "0"
          MONTAZ_NO_SAMPLE: "1"
          MONTAZ_NODE_TIMEOUT: "2400"
        run: .venv/bin/python -m unittest discover -s tests
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (whole history, built-in rules only)
        run: |
          # a committed .gitleaks.toml / .gitleaksignore would let the repo allow-list its own leak
          test ! -e .gitleaks.toml && test ! -e .gitleaksignore
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 git /repo --redact --verbose --exit-code 1
